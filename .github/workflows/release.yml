name: release

# Publishes the prebuilt binaries that action.yml downloads. Without these the
# Action cannot install a CLI, so a tag that skips this workflow silently breaks
# every downstream `uses:` of the action.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to.
        required: true

permissions:
  contents: write
  # For actions/attest-build-provenance and actions/attest: OIDC token exchange
  # with Sigstore (Fulcio issues a short-lived certificate bound to this exact
  # workflow run; no long-lived key), and writing the resulting attestation to
  # this repository's attestations API. Keyless throughout -- no signing secret
  # to provision, store, or rotate. See ADR-0006.
  id-token: write
  attestations: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Was macos-13, which GitHub retired. A workflow requesting a removed
          # label does not fail -- the job sits queued indefinitely, so the run
          # never completes and nothing surfaces as broken. v0.5.0, v0.5.1 and
          # v0.6.0 each published Linux and Apple Silicon binaries and silently
          # shipped no Intel macOS binary at all.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}

      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Remap source paths so the shipped binary carries no builder home
          # directory in its panic strings.
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$PWD=/annpack --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked --target "$TARGET"

      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -czf "annpack-$TARGET.tar.gz" -C "target/$TARGET/release" annpack
          shasum -a 256 "annpack-$TARGET.tar.gz" > "annpack-$TARGET.tar.gz.sha256"

      - name: Smoke the packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Unpack and run what will actually be published, not what is in
          # target/. A tarball that does not execute is worse than no release.
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "annpack-$TARGET.tar.gz" -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/annpack" build fixtures/docs-v1 \
            --output "$RUNNER_TEMP/smoke.annpack" \
            --name smoke --version 0.0.0 --json > /dev/null
          "$RUNNER_TEMP/unpacked/annpack" verify "$RUNNER_TEMP/smoke.annpack" --json > /dev/null
          "$RUNNER_TEMP/unpacked/annpack" search "$RUNNER_TEMP/smoke.annpack" AP-104 \
            --mode lexical --json | grep -q AP-104

      - name: Reported version must match the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A binary that thinks it is a different version than the tag it is
          # published under is exactly the disagreement build provenance exists
          # to make detectable -- catch the cheap case here too, before anything
          # is uploaded.
          REPORTED="$("$RUNNER_TEMP/unpacked/annpack" --version | awk '{print $2}')"
          EXPECTED="${TAG#v}"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::binary reports version $REPORTED, tag is $TAG"
            exit 1
          fi

      # `annpack provenance create`'s `artifact` argument reads the artifact
      # root and content root *out of* an .annpack pack -- it parses the
      # file as ANNPack's own format. The CLI binary itself is not a pack
      # (it is an ELF/Mach-O executable), so that command cannot attest it;
      # every invocation fails with "invalid ANNPack: bad magic". A CLI
      # binary's own build provenance is attested below with GitHub's
      # generic, format-agnostic SLSA predicate instead -- the ANNPack
      # predicate stays scoped to what it is actually for: attesting a
      # customer's own compiled corpus, not this tool's binaries.
      - name: Attest generic build provenance (GitHub-native SLSA, keyless)
        # actions/attest-build-provenance@v2
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: annpack-${{ matrix.target }}.tar.gz

      # Hand the artifact to a single publishing job rather than uploading from
      # here. Three matrix jobs racing to update the same release is what broke
      # v0.6.1: two won and the third failed on the concurrent write, leaving a
      # release that looked complete and was missing a platform.
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annpack-${{ matrix.target }}
          if-no-files-found: error
          path: |
            annpack-${{ matrix.target }}.tar.gz
            annpack-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Every supported platform must be present
        shell: bash
        run: |
          set -euo pipefail
          # action.yml maps each runner to one of these names. A release missing
          # any of them is not a partial success -- it is a broken `uses:` for
          # everyone on that platform, which is how three consecutive releases
          # shipped no Intel macOS binary without anything reporting an error.
          #
          # Build provenance for these binaries lives in GitHub's own
          # attestation API (actions/attest-build-provenance, this workflow's
          # "Attest generic build provenance" step) -- checkable there
          # per-platform, not published as a release asset here.
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            for suffix in tar.gz tar.gz.sha256; do
              if [ ! -f "dist/annpack-$target.$suffix" ]; then
                echo "::error::missing release asset annpack-$target.$suffix"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l dist

      # softprops/action-gh-release@v2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*

  # The Python binding is a process wrapper around the CLI published above, so
  # it ships only after those binaries exist. It went unpublished for seven
  # months while the repository moved from 0.1.7 to 0.7.0 because nothing
  # automated it: `pip install annpack` served a pre-format-2 builder against a
  # wire format that had changed four times.
  publish-pypi:
    needs: publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies an OIDC token bound to this exact
      # workflow, so there is no API token to store or rotate. Same keyless
      # posture as the Sigstore attestation above.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Declared version must match the release tag
        shell: bash
        run: |
          set -euo pipefail
          # The same check the binary job applies to `annpack --version`. A
          # wheel whose version disagrees with its tag is unfixable once
          # uploaded: PyPI permits yanking a release, never replacing it.
          tag="${{ inputs.tag || github.ref_name }}"
          declared=$(grep -m1 '^version = ' bindings/python/pyproject.toml | cut -d'"' -f2)
          # v0.7.0-rc2 -> 0.7.0rc2, PEP 440's spelling of the same version.
          expected="${tag#v}"
          expected="${expected/-rc/rc}"
          if [ "$declared" != "$expected" ]; then
            echo "::error::pyproject declares $declared, tag $tag implies $expected"
            exit 1
          fi
          echo "version $declared matches tag $tag"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build bindings/python --outdir pypi-dist

      # pypa/gh-action-pypi-publish@v1.12.4
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc
        with:
          packages-dir: pypi-dist
