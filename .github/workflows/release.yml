name: release

# Publishes the prebuilt binaries that action.yml downloads. Without these the
# Action cannot install a CLI, so a tag that skips this workflow silently breaks
# every downstream `uses:` of the action.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to.
        required: true

permissions:
  contents: write
  # For actions/attest-build-provenance and actions/attest: OIDC token exchange
  # with Sigstore (Fulcio issues a short-lived certificate bound to this exact
  # workflow run; no long-lived key), and writing the resulting attestation to
  # this repository's attestations API. Keyless throughout -- no signing secret
  # to provision, store, or rotate. See ADR-0006.
  id-token: write
  attestations: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          # Was macos-13, which GitHub retired. A workflow requesting a removed
          # label does not fail -- the job sits queued indefinitely, so the run
          # never completes and nothing surfaces as broken. v0.5.0, v0.5.1 and
          # v0.6.0 each published Linux and Apple Silicon binaries and silently
          # shipped no Intel macOS binary at all.
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}

      # dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}

      # Swatinem/rust-cache@v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Remap source paths so the shipped binary carries no builder home
          # directory in its panic strings.
          export RUSTFLAGS="${RUSTFLAGS:-} --remap-path-prefix=$PWD=/annpack --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --release --locked --target "$TARGET"

      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tar -czf "annpack-$TARGET.tar.gz" -C "target/$TARGET/release" annpack
          shasum -a 256 "annpack-$TARGET.tar.gz" > "annpack-$TARGET.tar.gz.sha256"

      - name: Smoke the packaged binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Unpack and run what will actually be published, not what is in
          # target/. A tarball that does not execute is worse than no release.
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "annpack-$TARGET.tar.gz" -C "$RUNNER_TEMP/unpacked"
          "$RUNNER_TEMP/unpacked/annpack" build fixtures/docs-v1 \
            --output "$RUNNER_TEMP/smoke.annpack" \
            --name smoke --version 0.0.0 --json > /dev/null
          "$RUNNER_TEMP/unpacked/annpack" verify "$RUNNER_TEMP/smoke.annpack" --json > /dev/null
          "$RUNNER_TEMP/unpacked/annpack" search "$RUNNER_TEMP/smoke.annpack" AP-104 \
            --mode lexical --json | grep -q AP-104

      - name: Reported version must match the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A binary that thinks it is a different version than the tag it is
          # published under is exactly the disagreement build provenance exists
          # to make detectable -- catch the cheap case here too, before anything
          # is uploaded.
          REPORTED="$("$RUNNER_TEMP/unpacked/annpack" --version | awk '{print $2}')"
          EXPECTED="${TAG#v}"
          if [ "$REPORTED" != "$EXPECTED" ]; then
            echo "::error::binary reports version $REPORTED, tag is $TAG"
            exit 1
          fi

      - name: Hash the packaged binary and the exact executable
        id: digests
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "binary=$(shasum -a 256 "$RUNNER_TEMP/unpacked/annpack" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "archive=$(shasum -a 256 "annpack-$TARGET.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create ANNPack build-provenance predicate
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Predicate only (--predicate-only): actions/attest below constructs
          # its own _type/subject/predicateType wrapper and signs it keylessly.
          # A full statement here would nest a second, conflicting subject
          # inside the predicate it builds.
          "$RUNNER_TEMP/unpacked/annpack" provenance create \
            "$RUNNER_TEMP/unpacked/annpack" \
            --output "annpack-$TARGET.predicate.json" \
            --predicate-only \
            --repository "github.com/${{ github.repository }}" \
            --revision "git:${{ github.sha }}" \
            --builder-id "github-actions:${{ github.workflow }}:${{ github.run_id }}" \
            --builder-binary "$RUNNER_TEMP/unpacked/annpack" \
            --invocation-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --system-clock \
            --platform "$TARGET" \
            --locked true \
            --param "tag=$TAG" \
            --param "artifact_archive_sha256=${{ steps.digests.outputs.archive }}"
          # Bound to the *unpacked binary*, since that -- not the tar archive --
          # is what builder_binary_sha256 and the smoke test both refer to. The
          # archive digest is folded in as a build parameter so a reader can
          # still tie the predicate to the exact published asset.

      - name: Sign the ANNPack predicate (GitHub OIDC, keyless)
        id: annpack-attest
        # actions/attest@v4.2.2
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: annpack-${{ matrix.target }}.tar.gz
          predicate-type: https://annpack.dev/attestations/build/v1
          predicate-path: annpack-${{ matrix.target }}.predicate.json

      - name: Export the ANNPack attestation bundle as a release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE_PATH: ${{ steps.annpack-attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "annpack-$TARGET.annpack-provenance.sigstore.json"

      - name: Attest generic build provenance (GitHub-native SLSA, keyless)
        # actions/attest-build-provenance@v2
        #
        # Deliberately separate from the ANNPack attestation above and not a
        # substitute for it. This answers "where and how did this workflow
        # build the subject" in GitHub's own SLSA predicate shape; the
        # ANNPack attestation answers "which source digest and artifact root
        # bind to it" in ANNPack's. Neither implies the other's claims.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: annpack-${{ matrix.target }}.tar.gz

      # Hand the artifact to a single publishing job rather than uploading from
      # here. Three matrix jobs racing to update the same release is what broke
      # v0.6.1: two won and the third failed on the concurrent write, leaving a
      # release that looked complete and was missing a platform.
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: annpack-${{ matrix.target }}
          if-no-files-found: error
          path: |
            annpack-${{ matrix.target }}.tar.gz
            annpack-${{ matrix.target }}.tar.gz.sha256
            annpack-${{ matrix.target }}.predicate.json
            annpack-${{ matrix.target }}.annpack-provenance.sigstore.json

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      # actions/download-artifact@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Every supported platform must be present, with signed provenance
        shell: bash
        run: |
          set -euo pipefail
          # action.yml maps each runner to one of these names. A release missing
          # any of them is not a partial success -- it is a broken `uses:` for
          # everyone on that platform, which is how three consecutive releases
          # shipped no Intel macOS binary without anything reporting an error.
          #
          # The unsigned predicate is required on the same footing as the
          # binary. The exported Sigstore bundle is required too: without it,
          # the ANNPack attestation actions/attest just created exists only in
          # GitHub's attestation API, and an independent verifier who is not
          # calling that API -- offline, or years after this run -- would have
          # no evidence at all. Publishing the bundle as a release asset is
          # what makes it independently checkable rather than platform-hosted.
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            for suffix in tar.gz tar.gz.sha256 predicate.json annpack-provenance.sigstore.json; do
              if [ ! -f "dist/annpack-$target.$suffix" ]; then
                echo "::error::missing release asset annpack-$target.$suffix"
                missing=1
              fi
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -l dist

      # softprops/action-gh-release@v2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
