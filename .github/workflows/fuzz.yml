name: fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz pack parser (reject-early paths)
        working-directory: fuzz
        run: cargo +nightly fuzz run open_pack -- -max_total_time=60
      # The targets above cannot reach the parser: opening a pack checks a
      # BLAKE3 root over the directory, and random mutation does not produce a
      # hash match. Measured, 0 of 53 corpus inputs from open_pack_prefixed get
      # past that gate after 8.1M executions. These two do.
      - name: Fuzz container past the root gate
        working-directory: fuzz
        run: cargo +nightly fuzz run open_consistent_pack -- -max_total_time=120
      - name: Fuzz query path
        working-directory: fuzz
        run: cargo +nightly fuzz run search_query -- -max_total_time=120
      - name: Fuzz varint decoder
        working-directory: fuzz
        run: cargo +nightly fuzz run decode_varint -- -max_total_time=60
      - name: Fuzz delta parser
        working-directory: fuzz
        run: cargo +nightly fuzz run inspect_delta -- -max_total_time=60
