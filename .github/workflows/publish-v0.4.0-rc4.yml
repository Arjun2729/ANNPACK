name: publish v0.4.0-rc4 prerelease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.0-rc4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.4.0-rc4
      EXPECTED_COMMIT: c574ab2aec733c916dfdbb9cd3994a2a9fd9e1d3
      ARCHIVE: annpack-v0.4.0-rc4-x86_64-unknown-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify immutable tag target
        run: |
          set -euo pipefail
          git fetch --tags --force
          actual=$(git rev-list -n 1 "$TAG")
          if [[ "$actual" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::refusing to publish: $TAG points to $actual, expected $EXPECTED_COMMIT"
            exit 1
          fi
          version=$(git show "$TAG:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)
          [[ "$version" == "0.4.0-rc4" ]] || {
            echo "::error::tagged package version is $version"
            exit 1
          }

      - name: Build Linux binary from the tag
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/release-src" "$TAG"
          cd "$RUNNER_TEMP/release-src"
          cargo build --release --locked
          mkdir -p "$RUNNER_TEMP/package"
          install -m 0755 target/release/annpack "$RUNNER_TEMP/package/annpack"
          tar -C "$RUNNER_TEMP/package" -czf "$RUNNER_TEMP/$ARCHIVE" annpack
          cd "$RUNNER_TEMP"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          git show "$TAG:RELEASE-NOTES-v0.4.0-rc4.md" > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ## Install

          ```bash
          cargo install --git https://github.com/Arjun2729/annpackv2 \
            --tag v0.4.0-rc4 annpack
          ```

          Rust 1.88 or newer is required.

          ## Prebuilt Linux artifact

          The attached `annpack-v0.4.0-rc4-x86_64-unknown-linux-gnu.tar.gz` was
          built by GitHub Actions from the immutable `v0.4.0-rc4` tag. Verify it
          with the attached `.sha256` file before use.
          EOF

      - name: Create or repair the GitHub prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
            jq -n \
              --arg name "ANNPack v0.4.0-rc4" \
              --rawfile body "$RUNNER_TEMP/release-notes.md" \
              '{name:$name, body:$body, draft:false, prerelease:true}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ANNPack v0.4.0-rc4" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/$ARCHIVE" \
            "$RUNNER_TEMP/$ARCHIVE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published release state
        run: |
          set -euo pipefail
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,assets \
            > "$RUNNER_TEMP/release.json"
          jq -e \
            --arg tag "$TAG" \
            --arg archive "$ARCHIVE" \
            '.tagName == $tag
             and .name == "ANNPack v0.4.0-rc4"
             and (.isDraft | not)
             and .isPrerelease
             and ([.assets[].name] | index($archive) != null)
             and ([.assets[].name] | index($archive + ".sha256") != null)' \
            "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"
