name: Sigstore verification fixture

# Manual by default. The branch trigger is deliberately narrow and exists so
# Step 7.2 can generate its repository-owned verification fixture once without
# changing the release workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - codex/sigstore-verification-fixture

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build deterministic ANNPack fixture and predicate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --features github-attestation
          target/release/annpack build fixtures/docs-v1 \
            --output sigstore-fixture.annpack \
            --name sigstore-fixture --version 1.0.0 --json
          target/release/annpack provenance create sigstore-fixture.annpack \
            --output sigstore-fixture.predicate.json \
            --predicate-only \
            --repository "github.com/${{ github.repository }}" \
            --revision "git:${{ github.sha }}" \
            --builder-id "github-actions:${{ github.workflow }}:${{ github.run_id }}" \
            --builder-binary target/release/annpack \
            --invocation-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --system-clock --locked true

      - name: Attest ANNPack fixture
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: sigstore-fixture.annpack
          predicate-type: https://annpack.dev/attestations/build/v1
          predicate-path: sigstore-fixture.predicate.json

      - name: Export bundle and pinned digests
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" sigstore-fixture.bundle.json
          curl --fail --silent --show-error --location \
            https://tuf-repo-cdn.sigstore.dev/targets/trusted_root.json \
            --output sigstore-fixture.trusted-root.json
          target/release/annpack provenance verify-github \
            sigstore-fixture.annpack sigstore-fixture.bundle.json \
            --trusted-root sigstore-fixture.trusted-root.json \
            --allowed-issuer https://token.actions.githubusercontent.com \
            --allowed-repository "https://github.com/${{ github.repository }}" \
            --allowed-workflow-ref \
              "https://github.com/${{ github.repository }}/.github/workflows/sigstore-verification-fixture.yml@${{ github.ref }}" \
            --json > sigstore-fixture.expected-report.json
          sha256sum sigstore-fixture.annpack \
            sigstore-fixture.bundle.json \
            sigstore-fixture.predicate.json \
            sigstore-fixture.trusted-root.json \
            sigstore-fixture.expected-report.json > sigstore-fixture.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sigstore-verification-fixture-${{ github.sha }}
          if-no-files-found: error
          path: |
            sigstore-fixture.annpack
            sigstore-fixture.bundle.json
            sigstore-fixture.predicate.json
            sigstore-fixture.trusted-root.json
            sigstore-fixture.expected-report.json
            sigstore-fixture.sha256
