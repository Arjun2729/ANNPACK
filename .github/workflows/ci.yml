name: ci

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  generate-okf-v02-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/okf-v02-current-fixture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build compiler and regenerate current OKF v0.2 roots
        run: |
          cargo build --release --all-features
          UPDATE_EXPECTED_ROOTS=1 ./launch/google-okf/reproduce.sh
          ./scripts/build-demo-packs.sh
          python3 scripts/sync-okf-fixture-metadata.py
          ./scripts/sync-docs-site.sh
      - name: Verify deterministic fixture and public contract
        run: |
          ./launch/google-okf/reproduce.sh
          python3 scripts/check-demo-reproducibility.py
          python3 scripts/sync-okf-fixture-metadata.py --check
          python3 scripts/check-world-demo.py
          git diff --check
      - name: Commit generated v0.2 fixture and restore CI
        run: |
          git fetch origin agent/world-demo-contract
          git show origin/agent/world-demo-contract:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            launch/google-okf/expected-roots.json \
            launch/google-okf/README.md \
            web/index.html docs/index.html \
            docs/packs/google-okf-ga4.annpack \
            docs/packs/google-okf-ga4.pub
          git commit -m 'okf: publish current v0.2 interoperability fixture'
          git push origin HEAD:agent/okf-v02-current-fixture
