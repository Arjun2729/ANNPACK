name: ci

on:
  pull_request:
  push:

permissions:
  contents: write

jobs:
  finalize-deterministic-demo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deterministic-world-demo-rc4
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Harden browser claims and signature failure behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/index.html')
          text = path.read_text()

          def replace_exact(old: str, new: str, count: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f'web/index.html: expected {count} occurrence(s), found {actual}: {old!r}'
                  )
              text = text.replace(old, new, count)

          replace_exact(
              '<div class="badge">live artifact laboratory</div>',
              '<div class="badge">candidate format · v0.4.0-rc4</div>',
          )
          replace_exact(
              '<div class="status"><span class="dot" id="status-dot"></span><span id="status">Opening and verifying the remote artifact…</span></div>',
              '<div class="status" role="status" aria-live="polite"><span class="dot" id="status-dot"></span><span id="status">Opening and verifying the remote artifact…</span></div>',
          )
          replace_exact(
              '<div id="results" class="empty">Verified results will appear here with reproducible evidence.</div>',
              '<div id="results" class="empty" aria-live="polite">Verified results will appear here with reproducible evidence.</div>',
          )
          replace_exact(
              '''    <div class="flow">
      <b id="source-format">Markdown / OKF</b><i>→</i><b>deterministic compiler</b><i>→</i><b>one .annpack</b><i>→</i><b>browser / MCP / native</b>
    </div>

    <section class="laboratory">''',
              '''    <div class="flow">
      <b id="source-format">Markdown / OKF</b><i>→</i><b>deterministic compiler</b><i>→</i><b>one .annpack</b><i>→</i><b>browser / MCP / native</b>
    </div>
    <p class="cap" style="max-width: 820px; margin: -18px 0 34px;">This verifies artifact integrity, signature validity, and retrieved-passage provenance. It does not establish publisher identity without an external trusted key, prove freshness, or prove that a model answer follows from the passage.</p>

    <section class="laboratory">''',
          )
          replace_exact(
              'try { await pack.verifySignatures(); } catch (_signatureError) { /* leave publisher unverified */ }',
              'await pack.verifySignatures();',
              2,
          )
          replace_exact(
              '· Core conformant · artifact identity verified',
              '· Core conformant · artifact integrity verified',
          )
          path.write_text(text)
          PY
      - name: Rebuild pinned artifacts twice
        run: |
          cargo build --release --all-features
          ./launch/google-okf/reproduce.sh
          ./scripts/build-demo-packs.sh
          sha256sum \
            docs/docs-v1.annpack \
            docs/docs-v2.annpack \
            docs/packs/google-okf-ga4.annpack \
            docs/packs/google-okf-ga4.pub > "$RUNNER_TEMP/first.sha256"
          ./scripts/build-demo-packs.sh
          sha256sum \
            docs/docs-v1.annpack \
            docs/docs-v2.annpack \
            docs/packs/google-okf-ga4.annpack \
            docs/packs/google-okf-ga4.pub > "$RUNNER_TEMP/second.sha256"
          diff -u "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256"
          ./scripts/sync-docs-site.sh
          git diff --check
      - name: Commit reproducible generated surface and restore CI
        run: |
          git fetch origin agent/public-repo-hygiene
          git show origin/agent/public-repo-hygiene:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ci.yml \
            web/index.html docs/index.html \
            docs/docs-v1.annpack docs/docs-v2.annpack \
            docs/packs/google-okf-ga4.annpack docs/packs/google-okf-ga4.pub
          git commit -m 'demo: publish deterministic signed GA4 surface'
          git push origin HEAD:agent/deterministic-world-demo-rc4
