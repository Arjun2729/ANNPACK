name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Public-surface hygiene
        run: python3 scripts/check-public-surface.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --all-features
      - name: Retrieval evaluation harness
        run: |
          target/release/annpack build fixtures/docs-v1 --output target/eval.annpack --name eval-fixture --version 1.0.0 --vectors fixtures/vectors-v1.json --json
          python3 evals/evaluate.py --binary target/release/annpack --pack target/eval.annpack --queries evals/fixture-qrels.jsonl --vector-profile fixture-v1 --k 2 --require-vectors --min-hybrid-recall 1 --require-hybrid-not-worse --enforce
      - name: Node binding
        run: node bindings/node/smoke.mjs
      - name: Python binding
        run: python3 -m unittest discover -s bindings/python/tests -v
      - name: Framework integrations
        run: node integrations/smoke.mjs
      - name: Aggressive release gates
        run: python3 benches/benchmark.py --enforce
      - name: Crawl-vs-pack range gates
        run: python3 benches/crawl_vs_pack.py --enforce
      - name: Core conformance packet (reference adapter)
        run: |
          ./spec/conformance/run.py \
            --adapter ./scripts/reference-adapter.sh \
            --implementation rust/annpack-reference \
            --output "$RUNNER_TEMP/report.json"
          python3 scripts/check-conformance-stable.py \
            "$RUNNER_TEMP/report.json" spec/conformance/reference-report.json
      - name: Node binding
        run: node bindings/node/smoke.mjs
      - name: Python binding
        run: python3 -m unittest discover -s bindings/python/tests -v
      - name: Framework integrations
        run: node integrations/smoke.mjs
      - name: Aggressive release gates
        run: python3 benches/benchmark.py --enforce
      - name: Crawl-vs-pack range gates
        run: python3 benches/crawl_vs_pack.py --enforce
      - name: Core conformance packet (reference adapter)
        run: |
          # The packet is the contract handed to independent implementers. Run it
          # against ourselves every build so it cannot rot, and fail if the
          # committed reference report stops matching.
          ./spec/conformance/run.py \
            --adapter ./scripts/reference-adapter.sh \
            --implementation rust/annpack-reference \
            --output "$RUNNER_TEMP/report.json"
          python3 - "$RUNNER_TEMP/report.json" spec/conformance/reference-report.json <<'PY'
          import json, sys
          fresh, committed = (json.load(open(p)) for p in sys.argv[1:3])
          for key in ("total", "passed", "failed", "conformant"):
              if fresh[key] != committed[key]:
                  raise SystemExit(
                      f"::error::conformance report drifted: {key} "
                      f"{committed[key]} -> {fresh[key]}. Regenerate with "
                      f"scripts/build-conformance-packet.sh and review the change."
                  )
          print(f"conformance stable: {fresh['passed']}/{fresh['total']}")
          PY

  demo-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release compiler
        run: cargo build --release --all-features
      - name: Fetch pinned OKF source and verify roots
        run: ./launch/google-okf/reproduce.sh
      - name: Rebuild tracked demo twice, byte for byte
        run: python3 scripts/check-demo-reproducibility.py
      - name: Verify committed demo signature
        run: |
          target/release/annpack verify docs/packs/google-okf-ga4.annpack \
            --public-key docs/packs/google-okf-ga4.pub > /dev/null

  same-builder-determinism:
    # Enforce that THIS builder produces an identical artifact root across
    # operating systems and toolchain versions. That is the only reproducibility
    # claim the project makes: the artifact root commits to DEFLATE output and
    # section layout, which the specification does not normatively fix, so this
    # job does NOT establish cross-implementation reproducibility. See
    # spec/FORMAT-v3.md §3.1 and ADR-0003.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.88.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release
      - name: Assert golden content root is environment-independent
        shell: bash
        env:
          EXPECTED: b1f63b4acdbee0a89de5c3455505be279845b4eda644c0d6c931814355a9d70b
        run: |
          ROOT=$(target/release/annpack build spec/test-vectors/source \
            --output "$RUNNER_TEMP/golden.annpack" \
            --name minimal-conformance --version 3.0.0 \
            --description "Canonical ANNPack v3 golden artifact" \
            --source-revision spec:FORMAT-v3 --base-url https://example.test \
            --license CC0-1.0 | grep -oE 'root [0-9a-f]{64}' | awk '{print $2}')
          echo "built root: $ROOT"
          if [ "$ROOT" != "$EXPECTED" ]; then
            echo "::error::same-builder determinism broken on ${{ matrix.os }} / rust ${{ matrix.rust }}: $ROOT != $EXPECTED"
            exit 1
          fi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build native CLI and demo packs for the browser smokes
        run: |
          cargo build --release
          target/release/annpack build fixtures/docs-v1 \
            --output target/docs-v1.annpack \
            --name vendor-docs --version 1.0.0 \
            --source-revision git:v1 \
            --base-url https://vendor.example/docs/v1
          cp target/docs-v1.annpack web/docs-v1.annpack
          mkdir -p web/packs
          cp docs/packs/google-okf-ga4.annpack web/packs/

      # Smoke the TRACKED runtime BEFORE rebuilding. Rebuilding first is what let
      # a stale committed artifact survive: the v0.3.1 WASM predated a manifest
      # schema change and failed with `missing field `builder``, but CI never
      # saw it because every job rebuilt before testing. WASM output is not
      # byte-reproducible across host toolchains, so staleness is detected by
      # running the committed bytes, not by diffing them against a fresh build.
      - name: Tracked WASM runtime must work as committed
        run: |
          for smoke in smoke smoke-range smoke-offline smoke-vector smoke-okf; do
            echo "--- tracked: $smoke"
            node "web/$smoke.mjs" > /dev/null
          done
      - name: docs/ must be a clean copy of web/
        run: |
          ./scripts/sync-docs-site.sh
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ has drifted from web/. Run ./scripts/sync-docs-site.sh and commit."
            git --no-pager diff --stat -- docs
            exit 1
          fi

      # Now prove the runtime still builds from source and that a fresh build
      # also passes. Byte equality with the tracked artifact is deliberately not
      # asserted; it does not hold across host platforms.
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Rebuild browser runtime from source
        env:
          RUSTUP_BIN: /home/runner/.cargo/bin
          WASM_BINDGEN: /home/runner/.cargo/bin/wasm-bindgen
        run: ./web/build-wasm.sh
      - name: Freshly built runtime must also pass
        run: |
          for smoke in smoke smoke-range smoke-offline smoke-vector smoke-okf; do
            echo "--- fresh: $smoke"
            node "web/$smoke.mjs" > /dev/null
          done
      - name: Pinned Transformers.js adapter contract
        run: node web/smoke-transformers-adapter.mjs
