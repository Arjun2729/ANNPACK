name: ci

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Public-surface hygiene
        run: python3 scripts/check-public-surface.py
      - name: Documentation must not contradict the implementation
        run: python3 scripts/check-doc-consistency.py
      # Pinned to a version, not to `stable`. Every action here is pinned by
      # digest, but the toolchain was not: when 1.98.0 released on 2026-08-18 it
      # added clippy::chunks_exact_to_as_chunks and main went red with no commit
      # responsible. A new lint is worth adopting deliberately, not by surprise.
      # Bump this and fix what it finds in the same change.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Lint (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (all features)
        run: cargo test --all-targets --all-features
      - name: Release build
        run: cargo build --release --all-features
      - name: Retrieval evaluation harness
        run: |
          target/release/annpack build fixtures/docs-v1 --output target/eval.annpack --name eval-fixture --version 1.0.0 --vectors fixtures/vectors-v1.json --json
          python3 evals/evaluate.py --binary target/release/annpack --pack target/eval.annpack --queries evals/fixture-qrels.jsonl --vector-profile fixture-v1 --k 2 --require-vectors --min-hybrid-recall 1 --require-hybrid-not-worse --enforce
      - name: Node binding
        run: node bindings/node/smoke.mjs
      - name: Python binding
        run: python3 -m unittest discover -s bindings/python/tests -v
      - name: Framework integrations
        run: node integrations/smoke.mjs
      - name: Aggressive release gates
        run: python3 benches/benchmark.py --enforce
      - name: Crawl-vs-pack range gates
        run: python3 benches/crawl_vs_pack.py --enforce
      - name: Browser runtime must pass the same suite
        run: |
          # The browser implements tokenization, BM25 and container parsing
          # separately from rust/, and the two had already diverged once on
          # fusion while every browser smoke still passed. Driving it through
          # the conformance contract applies the tokenizer vectors, the exact
          # IEEE-754 scores and the corruption corpus to it too.
          ./spec/conformance/run.py \
            --adapter ./spec/conformance/readers/browser-adapter.sh \
            --implementation js/browser-runtime \
            --output "$RUNNER_TEMP/browser-report.json"

      - name: Second reader must still pass the suite
        run: |
          # The previous second reader was allowed to rot: it was written once,
          # never run again, and silently stopped matching the format. Running
          # it every build is the only thing that stops that recurring.
          pip install --quiet blake3
          ./spec/conformance/run.py \
            --adapter ./spec/conformance/readers/python-adapter.sh \
            --implementation python/second-reader \
            --output "$RUNNER_TEMP/python-report.json"

      - name: Core conformance packet (reference adapter)
        run: |
          # The packet is the contract handed to independent implementers. Run it
          # against ourselves every build so it cannot rot, and fail if the
          # committed reference report stops matching.
          ./spec/conformance/run.py \
            --adapter ./scripts/reference-adapter.sh \
            --implementation rust/annpack-reference \
            --output "$RUNNER_TEMP/report.json"
          python3 scripts/check-conformance-stable.py \
            "$RUNNER_TEMP/report.json" spec/conformance/reference-report.json

      - name: Committed conformance packet must be what its generator produces
        run: |
          # The step above compares the reference implementation against the
          # committed vectors. Both sides are committed, so they stay consistent
          # with each other while drifting together away from what the builder
          # emits -- which is exactly what happened: the packet was generated at
          # manifest section format 3, the builder has emitted 4 since ADR-0005,
          # and the conformance pack root had moved with nothing to notice.
          # Rebuilding from the committed corpus is the only check that catches
          # it, the same way check-demo-reproducibility.py does for demo packs.
          python3 scripts/check-conformance-packet-fresh.py

  # A passing suite says the code does what the tests describe. It does not say
  # the tests would notice a check being removed, and this repository has
  # shipped tests that would not have: a hybrid-parity smoke that passed against
  # a reverted implementation, and a corruption test that stayed green under
  # --all-features while the artifact root check was compiled out. Its own first
  # run found two more.
  mutation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Removing any security check must fail the suite
        run: python3 scripts/check-mutations.py
      - name: The audit must leave the tree exactly as it found it
        run: |
          # It edits files in place and restores them through git. A leftover
          # mutation would silently weaken every later job in this workflow.
          if ! git diff --quiet; then
            echo "::error::the mutation audit did not restore every file"
            git --no-pager diff --stat
            exit 1
          fi

  demo-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build release compiler
        run: cargo build --release --all-features
      - name: Fetch pinned OKF source and verify roots
        run: ./examples/okf-reproduction/reproduce.sh
      - name: Rebuild tracked demo twice, byte for byte
        run: python3 scripts/check-demo-reproducibility.py
      - name: Verify committed demo signature
        run: |
          target/release/annpack verify docs/packs/google-okf-ga4.annpack \
            --public-key docs/packs/google-okf-ga4.pub > /dev/null
      - name: Verify world-facing claim contract
        run: python3 scripts/check-world-demo.py

  same-builder-determinism:
    # Enforce that THIS builder produces an identical artifact root across
    # operating systems and toolchain versions. That is the only reproducibility
    # claim the project makes: the artifact root commits to DEFLATE output and
    # section layout, which the specification does not normatively fix, so this
    # job does NOT establish cross-implementation reproducibility. See
    # spec/FORMAT-v3.md §3.1 and ADR-0003.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, "1.88.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Release build
        run: cargo build --release
      - name: Assert golden content root is environment-independent
        shell: bash
        env:
          EXPECTED: 16bcc5b14960e791b1c286a177f230636d9aad5f8440706ff4c7050139bce590
        run: |
          ROOT=$(target/release/annpack build spec/test-vectors/source \
            --output "$RUNNER_TEMP/golden.annpack" \
            --name minimal-conformance --version 3.0.0 \
            --description "Canonical ANNPack v3 golden artifact" \
            --source-revision spec:FORMAT-v3 --base-url https://example.test \
            --license CC0-1.0 | grep -oE 'root [0-9a-f]{64}' | awk '{print $2}')
          echo "built root: $ROOT"
          if [ "$ROOT" != "$EXPECTED" ]; then
            echo "::error::same-builder determinism broken on ${{ matrix.os }} / rust ${{ matrix.rust }}: $ROOT != $EXPECTED"
            exit 1
          fi

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build native CLI and demo packs for the browser smokes
        run: |
          cargo build --release
          target/release/annpack build fixtures/docs-v1 \
            --output target/docs-v1.annpack \
            --name vendor-docs --version 1.0.0 \
            --source-revision git:v1 \
            --base-url https://vendor.example/docs/v1
          cp target/docs-v1.annpack web/docs-v1.annpack
          mkdir -p web/packs
          cp docs/packs/google-okf-ga4.annpack web/packs/

      # Smoke the TRACKED runtime BEFORE rebuilding. Rebuilding first is what let
      # a stale committed artifact survive: the v0.3.1 WASM predated a manifest
      # schema change and failed with `missing field `builder``, but CI never
      # saw it because every job rebuilt before testing. WASM output is not
      # byte-reproducible across host toolchains, so staleness is detected by
      # running the committed bytes, not by diffing them against a fresh build.
      - name: Tracked WASM runtime must work as committed
        run: |
          for smoke in smoke smoke-range smoke-offline smoke-vector smoke-okf smoke-transfer smoke-hybrid-parity smoke-bundle; do
            echo "--- tracked: $smoke"
            node "web/$smoke.mjs" > /dev/null
          done
      - name: docs/ must be a clean copy of web/
        run: |
          ./scripts/sync-docs-site.sh
          if ! git diff --quiet -- docs; then
            echo "::error::docs/ has drifted from web/. Run ./scripts/sync-docs-site.sh and commit."
            git --no-pager diff --stat -- docs
            exit 1
          fi

      # Now prove the runtime still builds from source and that a fresh build
      # also passes. Byte equality with the tracked artifact is deliberately not
      # asserted; it does not hold across host platforms.
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Rebuild browser runtime from source
        env:
          RUSTUP_BIN: /home/runner/.cargo/bin
          WASM_BINDGEN: /home/runner/.cargo/bin/wasm-bindgen
        run: ./web/build-wasm.sh
      - name: Freshly built runtime must also pass
        run: |
          for smoke in smoke smoke-range smoke-offline smoke-vector smoke-okf smoke-transfer smoke-hybrid-parity smoke-bundle; do
            echo "--- fresh: $smoke"
            node "web/$smoke.mjs" > /dev/null
          done
      - name: Pinned Transformers.js adapter contract
        run: node web/smoke-transformers-adapter.mjs
