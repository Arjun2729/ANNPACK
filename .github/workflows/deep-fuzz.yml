name: deep-fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzz target
        required: false
        default: "18000"
  schedule:
    - cron: "17 20 * * 6"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # GitHub cancels a job on a hosted runner at six hours regardless of
    # timeout-minutes, so 390 was unreachable and every scheduled run was
    # killed at the ceiling rather than finishing. Sit below it, so an overrun
    # is our timeout with a clear signal instead of a silent cancellation.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: [open_pack, open_pack_prefixed, open_consistent_pack, search_query, decode_varint, inspect_delta]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Pinned like every other action in this repository. Nightly is still
      # requested by input rather than by branch, because cargo-fuzz needs it
      # and a moving nightly only costs a skipped fuzz run, never a blocked
      # merge.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          # Five hours, leaving an hour under the platform ceiling for
          # checkout, toolchain, and building cargo-fuzz. The previous 21600
          # asked for the whole six hours and left nothing: with a warm cache
          # fuzzing began 61s in and was cancelled 46s before it would have
          # finished; a cold cache misses by far more.
          FUZZ_SECONDS: ${{ inputs.seconds || '18000' }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=$FUZZ_SECONDS
      # Not `failure()`: a cancelled job is not a failed one, and while
      # cancellation was the normal outcome any crash found late would have
      # been discarded with it.
      - name: Preserve crash artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
