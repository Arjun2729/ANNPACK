[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "annpack"
version = "0.3.0"
description = "Python process binding for the ANNPack reference runtime"
requires-python = ">=3.10"
license = "Apache-2.0 OR MIT"

[tool.setuptools.packages.find]
where = ["."]
include = ["annpack*"]

