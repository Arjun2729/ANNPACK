[package]
name = "annpack"
version = "0.6.1"
edition = "2024"
description = "Reference implementation of the ANNPack knowledge distribution protocol"
license = "Apache-2.0"

[lib]
name = "annpack"
path = "rust/src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "annpack"
path = "rust/src/main.rs"

[features]
default = ["http", "signing"]
http = ["dep:ureq", "dep:url"]
signing = ["dep:ed25519-dalek", "dep:rand"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
# Removes the content-root check from `PackReader::open` so byte-mutation fuzz
# targets can reach the parser behind it. Catastrophically unsafe: a build with
# this feature AND `--cfg fuzzing` performs no artifact integrity verification.
#
# The feature alone does nothing. Cargo features are additive and there is no way
# to exclude one from `--all-features`, so gating on the feature by itself made
# `cargo test --all-features` disable integrity verification. The effective gate
# is `all(fuzzing, feature = "fuzzing-unsafe")`, and only cargo-fuzz sets
# `cfg(fuzzing)`.
fuzzing-unsafe = []

[lints.rust]
# `fuzzing` is set by cargo-fuzz, not by cargo, so it has to be declared or the
# `unexpected_cfgs` lint fires on the gate that reads it -- which under
# `-D warnings` would fail the build that the gate exists to protect.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
# Not optional: offline evidence receipts must verify in a build with no HTTP
# support, so base64 has to be present in every configuration.
base64 = "0.22"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"], optional = true }
hex = "0.4"
miniz_oxide = "0.8"
rand = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is required, not cosmetic: serde_json's default float parser
# is approximate and loses up to 1 ULP, so a score serialized and re-read would
# not compare equal. Core scoring is normative (FORMAT-v3 §6.2), so exact
# round-trip is a correctness requirement.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml_ng = "0.10"
serde-wasm-bindgen = { version = "0.6", optional = true }
sha2 = "0.10"
thiserror = "2"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = true, optional = true }
url = { version = "2.5", optional = true }
walkdir = "2.5"
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1.7"
tempfile = "3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
