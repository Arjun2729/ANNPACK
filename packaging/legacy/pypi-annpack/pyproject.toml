[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "annpack"
# One patch above the last real release under this name, so a fresh
# `pip install annpack` resolves to the notice rather than to the old binding.
version = "0.7.1"
description = "ANNPack is now Adyar. Install 'adyar' instead; this package only forwards."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# The shim forwards every call to the real binding, so it must pull it in.
dependencies = ["adyar>=0.7.1"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Arjun2729/ANNPACK"

[tool.setuptools.packages.find]
where = ["."]
include = ["annpack*"]
